<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>teadiOS architecture</title>
  <desc>A static console talks to Postgres through the Neon Data API with the user's JWT. Worker containers on team laptops claim jobs from Postgres with SKIP LOCKED, render with Remotion and upload the finished video to Cloudflare R2. A small Cloudflare upload Worker mints presigned URLs after Postgres authorises the caller.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa3b8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5bebb5"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6aa8ff"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffb44d"/>
    </marker>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2340"/><stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" rx="24" fill="#0d1020"/>

  <!-- title -->
  <text x="48" y="64" fill="#f3f5fb" font-size="30" font-weight="700">teadiOS</text>
  <text x="182" y="64" fill="#9aa3b8" font-size="20">a Remotion render farm made of the laptops you already own</text>
  <text x="48" y="94" fill="#6b7390" font-size="14">No broker, no API server, no load balancer. Postgres is the queue and the only authorization layer.</text>

  <!-- column labels -->
  <text x="48" y="140" fill="#6b7390" font-size="12" font-weight="700" letter-spacing="2">YOUR TEAM</text>
  <text x="440" y="140" fill="#6b7390" font-size="12" font-weight="700" letter-spacing="2">ONE DATABASE</text>
  <text x="912" y="140" fill="#6b7390" font-size="12" font-weight="700" letter-spacing="2">IDLE LAPTOPS</text>

  <!-- console -->
  <rect x="48" y="156" width="268" height="168" rx="16" fill="#161b30" stroke="#6aa8ff" stroke-width="2"/>
  <text x="70" y="192" fill="#f3f5fb" font-size="19" font-weight="700">Console</text>
  <text x="70" y="216" fill="#9aa3b8" font-size="14">Vite + React, built to static</text>
  <text x="70" y="238" fill="#9aa3b8" font-size="14">Clerk sign-in, client-side gate</text>
  <rect x="70" y="256" width="224" height="48" rx="10" fill="#0d1020"/>
  <text x="84" y="276" fill="#6aa8ff" font-size="13" font-family="ui-monospace, Menlo, monospace">submit render / generate</text>
  <text x="84" y="294" fill="#6aa8ff" font-size="13" font-family="ui-monospace, Menlo, monospace">poll job_events every 2s</text>

  <!-- postgres -->
  <rect x="430" y="156" width="340" height="330" rx="18" fill="url(#pg)" stroke="#5bebb5" stroke-width="2"/>
  <text x="452" y="192" fill="#f3f5fb" font-size="19" font-weight="700">Postgres (Neon)</text>
  <text x="452" y="216" fill="#9aa3b8" font-size="14">browser reaches it via the Data API</text>
  <g font-size="14">
    <rect x="452" y="236" width="296" height="50" rx="10" fill="#0d1020"/>
    <text x="468" y="258" fill="#5bebb5" font-weight="700">jobs: the queue</text>
    <text x="468" y="277" fill="#9aa3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">FOR UPDATE SKIP LOCKED</text>
    <rect x="452" y="294" width="296" height="50" rx="10" fill="#0d1020"/>
    <text x="468" y="316" fill="#5bebb5" font-weight="700">row-level security</text>
    <text x="468" y="335" fill="#9aa3b8" font-size="12">the only authorization layer</text>
    <rect x="452" y="352" width="296" height="50" rx="10" fill="#0d1020"/>
    <text x="468" y="374" fill="#5bebb5" font-weight="700">workers: heartbeats</text>
    <text x="468" y="393" fill="#9aa3b8" font-size="12">liveness from the database clock</text>
    <rect x="452" y="410" width="296" height="54" rx="10" fill="#0d1020"/>
    <text x="468" y="432" fill="#5bebb5" font-weight="700">job_events: live log</text>
    <text x="468" y="451" fill="#9aa3b8" font-size="12">sanitised, credentials redacted</text>
  </g>

  <!-- laptops -->
  <g>
    <rect x="900" y="156" width="252" height="96" rx="16" fill="#161b30" stroke="#ffb44d" stroke-width="2"/>
    <text x="922" y="190" fill="#f3f5fb" font-size="17" font-weight="700">laptop-1 · worker</text>
    <text x="922" y="212" fill="#9aa3b8" font-size="13">container, Node 22, no build step</text>
    <text x="922" y="232" fill="#ffb44d" font-size="13">rendering 62%</text>
    <rect x="1022" y="222" width="110" height="12" rx="6" fill="#0d1020"/>
    <rect x="1022" y="222" width="68" height="12" rx="6" fill="#ffb44d"/>

    <rect x="900" y="272" width="252" height="96" rx="16" fill="#161b30" stroke="#ffb44d" stroke-width="2"/>
    <text x="922" y="306" fill="#f3f5fb" font-size="17" font-weight="700">laptop-2 · worker</text>
    <text x="922" y="328" fill="#9aa3b8" font-size="13">@remotion/renderer</text>
    <text x="922" y="348" fill="#ffb44d" font-size="13">generate: agent writes it</text>

    <rect x="900" y="388" width="252" height="96" rx="16" fill="#161b30" stroke="#3a4260" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="922" y="422" fill="#f3f5fb" font-size="17" font-weight="700">laptop-3 · idle</text>
    <text x="922" y="444" fill="#9aa3b8" font-size="13">polls every ~2s</text>
    <text x="922" y="464" fill="#6b7390" font-size="13">next free machine takes it</text>
  </g>

  <!-- upload worker -->
  <rect x="48" y="560" width="268" height="118" rx="16" fill="#161b30" stroke="#9aa3b8" stroke-width="2"/>
  <text x="70" y="596" fill="#f3f5fb" font-size="19" font-weight="700">Upload Worker</text>
  <text x="70" y="620" fill="#9aa3b8" font-size="14">Cloudflare · the one tiny server</text>
  <text x="70" y="642" fill="#9aa3b8" font-size="14">mints presigned R2 URLs, asks</text>
  <text x="70" y="662" fill="#9aa3b8" font-size="14">Postgres with the caller's own JWT</text>

  <!-- R2 -->
  <rect x="430" y="560" width="340" height="118" rx="18" fill="#161b30" stroke="#ffb44d" stroke-width="2"/>
  <text x="452" y="596" fill="#f3f5fb" font-size="19" font-weight="700">Cloudflare R2</text>
  <text x="452" y="620" fill="#9aa3b8" font-size="14">finished videos and assets</text>
  <text x="452" y="642" fill="#9aa3b8" font-size="14">S3-compatible, zero egress fees</text>
  <text x="452" y="662" fill="#9aa3b8" font-size="14">outlives the laptop that made it</text>

  <!-- arrows: console <-> postgres -->
  <path d="M316 222 L426 222" stroke="#6aa8ff" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <path d="M426 262 L320 262" stroke="#6aa8ff" stroke-width="2.5" fill="none" marker-end="url(#ab)" stroke-dasharray="5 5"/>
  <text x="330" y="212" fill="#6aa8ff" font-size="12">JWT</text>
  <text x="330" y="282" fill="#6aa8ff" font-size="12">status</text>

  <!-- laptops -> postgres -->
  <path d="M896 204 L774 260" stroke="#5bebb5" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M896 320 L774 320" stroke="#5bebb5" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M896 436 L774 380" stroke="#5bebb5" stroke-width="2.5" fill="none" marker-end="url(#ag)" stroke-dasharray="5 5"/>
  <text x="790" y="300" fill="#5bebb5" font-size="12">claim · heartbeat</text>
  <text x="790" y="346" fill="#5bebb5" font-size="12">fenced writes</text>

  <!-- laptops -> R2 -->
  <path d="M1026 488 C 1026 600, 900 619, 774 619" stroke="#ffb44d" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <text x="800" y="540" fill="#ffb44d" font-size="12">upload mp4, then mark done</text>

  <!-- console -> upload worker, upload worker -> postgres, upload worker -> R2 -->
  <path d="M150 328 L150 556" stroke="#9aa3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="160" y="444" fill="#9aa3b8" font-size="12">need an upload URL</text>
  <path d="M280 556 C 300 500, 380 470, 428 452" stroke="#9aa3b8" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 5"/>
  <text x="218" y="530" fill="#9aa3b8" font-size="12">allowed?</text>
  <path d="M316 619 L426 619" stroke="#9aa3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="330" y="610" fill="#9aa3b8" font-size="12">presign</text>

  <!-- lifecycle -->
  <text x="48" y="728" fill="#6b7390" font-size="12" font-weight="700" letter-spacing="2">A JOB'S LIFE</text>
  <g font-size="14" font-weight="700">
    <rect x="48" y="742" width="104" height="34" rx="17" fill="#1b2340"/><text x="100" y="764" text-anchor="middle" fill="#f3f5fb">pending</text>
    <rect x="186" y="742" width="104" height="34" rx="17" fill="#1b2340"/><text x="238" y="764" text-anchor="middle" fill="#f3f5fb">claimed</text>
    <rect x="324" y="742" width="104" height="34" rx="17" fill="#1b2340"/><text x="376" y="764" text-anchor="middle" fill="#ffb44d">running</text>
    <rect x="462" y="742" width="120" height="34" rx="17" fill="#123328"/><text x="522" y="764" text-anchor="middle" fill="#5bebb5">completed</text>
  </g>
  <g stroke="#9aa3b8" stroke-width="2" fill="none">
    <path d="M154 759 L182 759" marker-end="url(#a)"/>
    <path d="M292 759 L320 759" marker-end="url(#a)"/>
    <path d="M430 759 L458 759" marker-end="url(#a)"/>
  </g>
  <text x="612" y="756" fill="#9aa3b8" font-size="13">stale heartbeat → back to pending, another laptop resumes the stage</text>
  <text x="612" y="776" fill="#9aa3b8" font-size="13">no file in R2 → never "completed" · failed and cancelled end it early</text>
</svg>
